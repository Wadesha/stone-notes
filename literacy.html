<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>宝宝识字启蒙台</title>
<style>
  :root{
    --bg:#FFF8E1; --card:#FFFFFF; --ink:#37474F; --sub:#78909C;
    --orange:#FF9800; --pink:#FF6FA5; --blue:#4FC3F7; --green:#81C784; --purple:#BA68C8;
    --red:#EF5350; --line:#FFE0B2; --shadow:0 4px 14px rgba(255,152,0,.15);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    font-size:18px; line-height:1.5;
  }
  .wrap{max-width:880px; margin:0 auto; padding:12px 14px 20px;}
  h1,h2,h3{margin:0;}
  .topbar{
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    background:linear-gradient(135deg,var(--orange),var(--pink));
    color:#fff; border-radius:18px; box-shadow:var(--shadow); position:sticky; top:8px; z-index:20;
  }
  .topbar .logo{width:38px;height:38px;flex:0 0 38px;}
  .topbar h1{font-size:21px; font-weight:800; letter-spacing:.5px;}
  .topbar .pts{
    margin-left:auto; background:rgba(255,255,255,.25); border-radius:999px;
    padding:6px 14px; font-weight:800; font-size:16px; display:flex; align-items:center; gap:6px;
  }
  .topbar .pts svg{width:20px;height:20px;}
  .modetabs{display:flex; gap:8px; margin:12px 0;}
  .modetabs button{
    flex:1; min-height:54px; border:none; border-radius:16px; font-size:18px; font-weight:800;
    background:var(--card); color:var(--sub); box-shadow:var(--shadow); display:flex;
    align-items:center; justify-content:center; gap:8px; cursor:pointer;
  }
  .modetabs button.active{background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff;}
  .modetabs button svg{width:24px;height:24px;}

  .today{
    background:linear-gradient(135deg,#FFF3E0,#FFE9F4); border:2px dashed var(--orange);
    border-radius:18px; padding:14px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .today .ttl{display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; color:var(--orange); margin-bottom:10px;}
  .today .ttl svg{width:24px;height:24px;}
  .trow{
    display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px;
    padding:8px 10px; margin-bottom:8px;
  }
  .trow .pic{width:42px;height:42px;flex:0 0 42px;}
  .trow .info{flex:1;}
  .trow .info .c{font-size:22px; font-weight:800;}
  .trow .info .p{font-size:13px; color:var(--sub);}
  .trow.overdue .info .c{color:var(--red);}
  .trow.overdue .tag{background:var(--red); color:#fff; font-size:11px; padding:2px 7px; border-radius:8px; margin-left:6px;}
  .btn{
    min-height:50px; border:none; border-radius:14px; font-size:17px; font-weight:800;
    padding:0 16px; cursor:pointer; background:var(--green); color:#fff; box-shadow:var(--shadow);
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn svg{width:20px;height:20px;}
  .btn.done{background:#CFD8DC; color:#607D8B;}
  .btn.sm{min-height:44px; font-size:15px; padding:0 12px;}
  .btn.orange{background:var(--orange);}
  .btn.pink{background:var(--pink);}
  .btn.blue{background:var(--blue);}
  .btn.red{background:var(--red);}
  .btn.ghost{background:#fff; color:var(--sub); border:2px solid var(--line); box-shadow:none;}

  .sec{background:var(--card); border-radius:18px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow);}
  .sec .hd{display:flex; align-items:center; gap:8px; font-weight:800; font-size:19px; margin-bottom:12px;}
  .sec .hd svg{width:26px;height:26px;}
  .sec .hd .hint{margin-left:auto; font-size:13px; color:var(--sub); font-weight:600;}

  /* flip cards */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px;}
  .flip{perspective:800px; cursor:pointer;}
  .flip .inner{position:relative; width:100%; height:150px; transition:transform .5s; transform-style:preserve-3d;}
  .flip.flipped .inner{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:var(--shadow); padding:8px;
  }
  .face.front{background:linear-gradient(135deg,#E1F5FE,#FFF9C4);}
  .face.back{background:linear-gradient(135deg,#F1F8E9,#E0F7FA); transform:rotateY(180deg);}
  .face .big{font-size:46px; font-weight:900; color:var(--ink);}
  .face .py{font-size:14px; color:var(--sub); margin-top:2px;}
  .face .picto{width:84px;height:84px;}
  .face .mn{font-size:14px; color:var(--sub); margin-top:4px; text-align:center; line-height:1.3;}

  .progress{height:16px; background:#FFE0B2; border-radius:999px; overflow:hidden; margin:6px 0 2px;}
  .progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--blue)); border-radius:999px;}
  .lvl{display:flex; align-items:center; gap:10px; margin:10px 0;}
  .lvl .badge{background:linear-gradient(135deg,var(--purple),var(--pink)); color:#fff; font-weight:800; padding:6px 14px; border-radius:12px; font-size:16px;}
  .stars{font-size:22px; letter-spacing:2px; color:var(--orange);}

  /* 组词 */
  .wordq{text-align:center; margin-bottom:12px;}
  .wordq .qc{font-size:54px; font-weight:900; color:var(--orange);}
  .wordq .qp{font-size:15px; color:var(--sub);}
  .wordq .qpic{width:80px;height:80px;margin:0 auto;}
  .wordopts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .wordopts button{
    min-height:58px; border:none; border-radius:14px; background:#E1F5FE; color:var(--ink);
    font-size:20px; font-weight:800; box-shadow:var(--shadow); cursor:pointer;
  }
  .wordopts button.ok{background:var(--green); color:#fff;}
  .wordopts button.no{background:var(--red); color:#fff;}
  .feedback{text-align:center; font-weight:800; font-size:18px; min-height:26px; margin-top:10px;}

  /* 商城 */
  .shop{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .ritem{background:#FFF3E0; border-radius:16px; padding:12px; text-align:center; box-shadow:var(--shadow);}
  .ritem .ri{width:40px;height:40px;margin:0 auto 6px;}
  .ritem .rn{font-weight:800; font-size:16px;}
  .ritem .rc{color:var(--orange); font-weight:800; margin:4px 0 8px;}
  .ritem .btn{width:100%;}

  /* parent */
  .panel{display:none;}
  .panel.show{display:block;}
  label{display:block; font-weight:700; font-size:14px; color:var(--sub); margin:10px 0 4px;}
  input,select,textarea{
    width:100%; min-height:50px; font-size:16px; padding:10px 12px; border:2px solid var(--line);
    border-radius:12px; background:#fff; color:var(--ink); font-family:inherit;
  }
  .chiprow{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{
    min-height:48px; padding:0 14px; border-radius:999px; border:2px solid var(--line);
    background:#fff; font-size:17px; font-weight:700; color:var(--sub); cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip.on{background:var(--blue); color:#fff; border-color:var(--blue);}
  .chip .cp{width:24px;height:24px;}
  .row2{display:flex; gap:10px;}
  .row2 > *{flex:1;}
  .listitem{display:flex; align-items:center; gap:10px; background:#FFF; border:2px solid var(--line); border-radius:14px; padding:10px; margin-bottom:8px;}
  .listitem .pic{width:40px;height:40px;flex:0 0 40px;}
  .listitem .tx{flex:1;}
  .listitem .tx .a{font-weight:800; font-size:17px;}
  .listitem .tx .b{font-size:13px; color:var(--sub);}

  /* modal */
  .mask{position:fixed; inset:0; background:rgba(55,71,79,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .mask.show{display:flex;}
  .modal{background:#fff; border-radius:20px; padding:22px; width:100%; max-width:360px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .modal h3{font-size:20px; margin-bottom:6px;}
  .modal p{color:var(--sub); font-size:14px; margin:4px 0 14px;}
  .modal input{text-align:center; letter-spacing:10px; font-size:26px; font-weight:800;}
  .modal .mbtns{display:flex; gap:10px; margin-top:14px;}

  .banner{background:#FFF3E0; border:2px solid var(--orange); color:var(--orange); border-radius:14px; padding:10px 14px; font-weight:700; font-size:14px; margin-bottom:14px;}

  .tip{font-size:13px; color:var(--sub); margin-top:8px; line-height:1.5;}
  @media(max-width:560px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .wordopts{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <svg class="logo" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#fff"/><text x="50" y="64" font-size="34" text-anchor="middle" font-weight="900" fill="#FF9800" font-family="sans-serif">字</text></svg>
    <h1>宝宝识字启蒙台</h1>
    <div class="pts" id="ptsBox">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 6.8 20.9l1.6-6.8L3.2 8.9l6.9-.6z"/></svg>
      <span id="ptsNum">0</span> 分
    </div>
  </div>

  <div class="modetabs">
    <button id="tabChild" class="active" data-act="mode" data-arg="child">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6z"/></svg>
      宝宝模式
    </button>
    <button id="tabParent" data-act="mode" data-arg="parent">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.2"/><circle cx="16" cy="9" r="2.6"/><path d="M3 20c0-3.5 3-5.5 6-5.5s6 2 6 5.5zM14 20c0-2.6 2-4 4-4s3 1.4 3 4z"/></svg>
      家长模式
    </button>
  </div>

  <div id="app"></div>
</div>

<!-- PIN modal -->
<div class="mask" id="pinMask">
  <div class="modal">
    <h3 id="pinTitle">家长验证</h3>
    <p id="pinDesc">请输入 4 位数字密码</p>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
    <div class="mbtns">
      <button class="btn ghost" data-act="pinCancel">取消</button>
      <button class="btn orange" data-act="pinOk">确定</button>
    </div>
  </div>
</div>

function pictoSVG(key){
  var inner = PICTO[key] || '<rect x="28" y="28" width="44" height="44" rx="8" fill="#E1F5FE" stroke="#4FC3F7" stroke-width="3"/><text x="50" y="62" font-size="28" text-anchor="middle" fill="#0288D1" font-family="sans-serif">字</text>';
  return '<svg class="picto" viewBox="0 0 100 100">'+inner+'</svg>';
}
function picSmall(key){ return '<svg class="pic" viewBox="0 0 100 100">'+pictoSVG(key).replace('<svg class="picto" viewBox="0 0 100 100">','').replace('</svg>','')+'</svg>'; }

/* ===== 图标 ===== */

function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ===== 派生数据 ===== */
function charById(id){for(var i=0;i<state.chars.length;i++)if(state.chars[i].id===id)return state.chars[i];return null;}
function learnedCount(){var n=0;state.chars.forEach(function(c){if(c.learned)n++;});return n;}
function level(){return Math.floor(learnedCount()/5)+1;}
function dayDone(day){return day.charIds.every(function(id){var c=charById(id);return c&&c.learned;});}
function todayList(){
  var t=todayStr(),res=[],seen={};
  state.days.forEach(function(d){
    if(d.date<=t && !dayDone(d)){
      d.charIds.forEach(function(id){if(!seen[id]){seen[id]=1;var c=charById(id);if(c&&!c.learned)res.push({id:id,overdue:d.date<t});}});
    }
  });
  return res;
}

/* 组词游戏 */
var wg=null;
function renderWordGame(){
  if(!wg){nextWord();}
  var box=document.getElementById("wordGame"); if(!box)return;
  if(!wg){box.innerHTML='<div style="color:var(--sub)">先去认会一些字，再来玩组词吧～</div>';return;}
  var c=charById(wg.charId);
  var html='<div class="wordq">'+pictoSVG(c.picto).replace('class="picto"','class="qpic"')+'<div class="qc">'+c.char+'</div><div class="qp">'+c.pinyin+' · 请点出含有「'+c.char+'」的词</div></div>';
  html+='<div class="wordopts">';
  wg.opts.forEach(function(o,i){html+='<button data-act="wordpick" data-arg="'+i+'">'+o+'</button>';});
  html+='</div><div class="feedback" id="wfb"></div>';
  box.innerHTML=html;
}
function nextWord(){
  var learned=state.chars.filter(function(c){return c.learned&&c.words&&c.words.length;});
  if(learned.length===0){wg=null;return;}
  // 优先用今天列表里已认会的字，否则随机
  var pool=learned;
  var pick=pool[Math.floor(Math.random()*pool.length)];
  var correct=pick.words[Math.floor(Math.random()*pick.words.length)];
  var others=[];
  state.chars.forEach(function(c){if(c.id!==pick.id&&c.words)others=others.concat(c.words);});
  others=others.filter(function(w){return w!==correct;});
  shuffle(others);
  var opts=[correct,others[0],others[1]].filter(Boolean);
  shuffle(opts);
  wg={charId:pick.id,correct:correct,opts:opts};
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ===== 行为 ===== */
var planSel=[];
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el)return;
  var act=el.getAttribute("data-act"),arg=el.getAttribute("data-arg");
  if(act==="mode"){switchMode(arg);return;}
  if(act==="flip"){el.classList.toggle("flipped");return;}
  if(act==="learn"){learnChar(arg);return;}
  if(act==="wordpick"){wordPick(parseInt(arg,10),el);return;}
  if(act==="redeem"){redeem(arg);return;}
  if(act==="export"){doExport();return;}
  if(act==="import"){doImport();return;}
  if(act==="clearSample"){clearSample();return;}
  if(act==="clearAll"){clearAll();return;}
  if(act==="delChar"){delChar(arg);return;}
  if(act==="addChar"){addChar();return;}
  if(act==="planChip"){planChip(arg,el);return;}
  if(act==="saveDay"){saveDay();return;}
  if(act==="delReward"){delReward(arg);return;}
  if(act==="addReward"){addReward();return;}
  if(act==="approve"){approve(arg);return;}
  if(act==="reject"){reject(arg);return;}
  if(act==="pinOk"){pinOk();return;}
  if(act==="pinCancel"){closePin();return;}
});

function switchMode(m){
  if(m==="child"){mode="child";planSel=[];render();return;}
  // parent
  var pw=localStorage.getItem(PKEY);
  if(!pw){pwMode="set";openPin("设置家长密码","设置 4 位数字密码（请牢记）");}
  else{pwMode="check";openPin("家长验证","请输入 4 位数字密码");}
}
function openPin(title,desc){
  document.getElementById("pinTitle").textContent=title;
  document.getElementById("pinDesc").textContent=desc;
  document.getElementById("pinInput").value="";
  document.getElementById("pinMask").classList.add("show");
  setTimeout(function(){document.getElementById("pinInput").focus();},100);
}
function closePin(){document.getElementById("pinMask").classList.remove("show");}
function pinOk(){
  var v=document.getElementById("pinInput").value;
  if(!/^\d{4}$/.test(v)){alert("请输入 4 位数字");return;}
  if(pwMode==="set"){localStorage.setItem(PKEY,v);closePin();mode="parent";planSel=[];render();}
  else{var pw=localStorage.getItem(PKEY);if(v===pw){closePin();mode="parent";planSel=[];render();}else{alert("密码错误，再试试");document.getElementById("pinInput").value="";}}
}

function learnChar(id){
  var c=charById(id); if(!c||c.learned)return;
  c.learned=true; state.points+=2;
  // 过关奖励
  var doneDay=null;
  state.days.forEach(function(d){if(d.charIds.indexOf(id)>=0 && dayDone(d))doneDay=d;});
  if(doneDay){
    state.points+=5;
    var dayLabel=doneDay.date===todayStr()?"今天":doneDay.date;
    setTimeout(function(){alert("🎉 "+dayLabel+"的 5 个字都认会啦！闯关成功，+5 分！");},50);
  }
  save();render();
}
function wordPick(i,el){
  if(!wg)return;
  var fb=document.getElementById("wfb");
  if(wg.opts[i]===wg.correct){
    el.classList.add("ok"); state.points+=1; save();
    fb.style.color="var(--green)"; fb.textContent="答对啦！+1 分 🎉";
    setTimeout(function(){nextWord();renderWordGame();},700);
  }else{
    el.classList.add("no"); fb.style.color="var(--red)"; fb.textContent="再想想～";
    setTimeout(function(){renderWordGame();},700);
  }
}
function redeem(id){
  var r=null;state.rewards.forEach(function(x){if(x.id===id)r=x;});if(!r)return;
  if(state.points<r.cost){alert("积分不够哦，再去认字闯关吧！");return;}
  state.redemptions.push({id:uid(),rewardId:id,name:r.name,cost:r.cost,status:"pending",ts:Date.now()});
  save();render();
}
function doExport(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="识字启蒙台备份_"+todayStr()+".json";a.click();
}
function doImport(){
  var inp=document.createElement("input");inp.type="file";inp.accept="application/json";
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){
      try{var d=JSON.parse(rd.result);
        if(!d.chars||!d.days)throw 0;
        state=d;save();render();alert("导入成功！");
      }catch(e){alert("文件格式不对，导入失败");}
    };
    rd.readAsText(f);
  };
  inp.click();
}
function clearSample(){
  if(!confirm("确定清空预置示例数据？你自已添加的字、奖励会保留。"))return;
  state.chars=state.chars.filter(function(c){return !c._sample;});
  state.days=state.days.filter(function(d){return !d._sample;});
  state.rewards=state.rewards.filter(function(r){return !r._sample;});
  save();render();
}
function clearAll(){
  if(!confirm("⚠️ 此操作会清空全部数据（字、规划、奖励、积分），且无法恢复！确定继续？"))return;
  if(!confirm("最后确认一次：真的要清空所有数据吗？"))return;
  localStorage.removeItem(KEY);state=seed();save();mode="child";render();
}
function delChar(id){
  if(!confirm("删除这个生字？已学会状态也会一起删。"))return;
  state.chars=state.chars.filter(function(c){return c.id!==id;});
  state.days.forEach(function(d){d.charIds=d.charIds.filter(function(x){return x!==id;});});
  save();render();
}
function addChar(){
  var ch=document.getElementById("nc_char").value.trim();
  var py=document.getElementById("nc_py").value.trim();
  var mn=document.getElementById("nc_mn").value.trim();
  var wd=document.getElementById("nc_wd").value.trim();
  if(!ch){alert("请填写汉字");return;}
  state.chars.push({id:uid(),char:ch,pinyin:py||"",meaning:mn||"",words:wd?wd.split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean):[],picto:ch,learned:false});
  save();render();
}
function planChip(id,el){
  var idx=planSel.indexOf(id);
  if(idx>=0){planSel.splice(idx,1);el.classList.remove("on");}
  else{if(planSel.length>=5){alert("每天最多 5 个字哦");return;}planSel.push(id);el.classList.add("on");}
  document.getElementById("planCount").textContent="已选 "+planSel.length+" / 5";
}
function saveDay(){
  var date=document.getElementById("plan_date").value||todayStr();
  if(planSel.length===0){alert("请先点选要学的字");return;}
  if(planSel.length>5){alert("每天最多 5 个字");return;}
  // 覆盖同一天
  var exist=false;
  state.days.forEach(function(d){if(d.date===date){d.charIds=planSel.slice();exist=true;}});
  if(!exist)state.days.push({id:uid(),date:date,charIds:planSel.slice()});
  planSel=[];save();render();
  alert("已保存 "+date+" 的字！");
}
function delReward(id){
  if(!confirm("删除这个奖励？"))return;
  state.rewards=state.rewards.filter(function(r){return r.id!==id;});
  save();render();
}
function addReward(){
  var name=document.getElementById("rw_name").value.trim();
  var cost=parseInt(document.getElementById("rw_cost").value,10);
  if(!name||!cost){alert("请填写名称和分数");return;}
  state.rewards.push({id:uid(),name:name,cost:cost,icon:"gift"});
  save();render();
}
function approve(id){
  var r=null;state.redemptions.forEach(function(x){if(x.id===id)r=x;});if(!r)return;
  if(state.points<r.cost){alert("宝宝积分不够啦，先积累一些吧");return;}
  state.points-=r.cost;r.status="done";save();render();
  alert("兑换成功！奖励："+r.name);
}
function reject(id){
  state.redemptions=state.redemptions.filter(function(x){return x.id!==id;});
  save();render();
}

/* init */
load();render();
</script>
</body>
</html>
